name: Security audit
on:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  # Re-run daily so a newly published advisory against an already-pinned
  # dependency is caught even when the manifests have not changed.
  schedule:
    - cron: '0 6 * * *'

jobs:
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes its findings via the Checks API, so the
    # job token needs checks:write. Declaring the block explicitly also stops
    # the run failing when the repo default GITHUB_TOKEN is read-only.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # master branch that supports NodeJS 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
